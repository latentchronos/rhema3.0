[package]
name = "rhema-comprehension-llama"
version = "0.1.0"
edition = "2021"

[dependencies]
rhema-comprehension = { path = "../comprehension" }
serde_json.workspace = true
thiserror.workspace = true
llama-cpp-2 = { version = "0.1", optional = true, features = ["common"] }
encoding_rs = { version = "0.8", optional = true }

[features]
default = []
llama = ["dep:llama-cpp-2", "dep:encoding_rs"]

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

[[example]]
name = "spike"
required-features = ["llama"]
