[package]
name = "rhema-comprehension-llama"
version = "0.1.0"
edition = "2021"

[dependencies]
rhema-comprehension = { path = "../comprehension" }
serde_json.workspace = true
thiserror.workspace = true
llama-cpp-2 = { version = "0.1", optional = true, features = ["common"] }
encoding_rs = { version = "0.8", optional = true }

[features]
default = []
llama = ["dep:llama-cpp-2", "dep:encoding_rs"]

[[example]]
name = "spike"
required-features = ["llama"]
