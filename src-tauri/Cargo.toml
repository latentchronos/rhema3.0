[workspace]
members = [
    ".",
    "crates/audio",
    "crates/vad",
    "crates/transcript",
    "crates/stt",
    "crates/bible",
    "crates/detection",
    "crates/broadcast",
    "crates/api",
    "crates/notes",
    "crates/comprehension",
    "crates/comprehension-llama",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
reqwest = { version = "0.12", features = ["json"] }

[package]
name = "app"
version = "0.1.0"
description = "Rhema - Real-Time AI Bible Verse Detection"
authors = ["Faithful"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json.workspace = true
serde.workspace = true
log.workspace = true
tokio.workspace = true
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
rhema-audio = { path = "crates/audio" }
rhema-vad = { path = "crates/vad" }
rhema-bible = { path = "crates/bible" }
rhema-stt = { path = "crates/stt" }
rhema-broadcast = { path = "crates/broadcast" }
rhema-detection = { path = "crates/detection", features = ["onnx", "vector-search"] }
rhema-api = { path = "crates/api" }
rhema-comprehension = { path = "crates/comprehension" }
# Local comprehension backend. Default features pull NO native code; the
# `local-comprehension` app feature turns on its `llama` feature (llama.cpp).
rhema-comprehension-llama = { path = "crates/comprehension-llama" }
crossbeam-channel = "0.5"
dotenvy = "0.15"
base64 = "0.22"

[features]
# Enable on-device GGUF transcription (Parakeet / Cohere Transcribe) as a selectable
# STT provider. Off by default: the standard build stays cloud-only (Deepgram) and
# pulls in no native ggml/BLAS dependency. Build with: cargo build --features local-stt
local-stt = ["rhema-stt/local-stt"]

# On-device comprehension LLM (Qwen3-1.7B via llama.cpp / rhema-comprehension-llama).
# Off by default: the standard build pulls no llama.cpp. Building it needs a
# libclang + gcc headers on this machine (see README / design-doc build gotchas):
#   LIBCLANG_PATH=/usr/lib/x86_64-linux-gnu \
#   BINDGEN_EXTRA_CLANG_ARGS=-I/usr/lib/gcc/x86_64-linux-gnu/15/include \
#   cargo build --features local-comprehension
local-comprehension = ["rhema-comprehension-llama/llama"]

# Neural speech-activity indicator (Silero VAD via ONNX Runtime) in place of the energy
# VAD. Off by default so the standard build pulls no ONNX runtime for VAD; the on-device
# `ort` is shared with rhema-detection's `onnx` feature when both are enabled. Needs
# model/silero_vad.onnx. Build with: cargo build --features neural-vad
neural-vad = ["rhema-vad/silero"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# On-device STT is compute-heavy (RNN-T decode loops + ggml). Optimize just these
# crates even in dev builds so `tauri dev` transcription runs at real-time speed
# WITHOUT needing --release. The rest of the app stays debuggable. These specs only
# apply when the local-stt feature pulls the crates in; otherwise they're inert.
[profile.dev.package.rhema-stt]
opt-level = 3
[profile.dev.package.transcribe-cpp]
opt-level = 3
[profile.dev.package.transcribe-cpp-sys]
opt-level = 3
# The audio gate (feedback/flux/variance per window) and the verse detector (scans
# ~31k verses on every emit) are the other two real-time hot paths. Unoptimized they
# burn CPU on the same cores the streaming model needs, starving its headroom. Optimize
# them in dev too so the model keeps its cores — this is what lets the low-lookahead
# streaming config stay ahead of real time.
[profile.dev.package.rhema-audio]
opt-level = 3
[profile.dev.package.rhema-detection]
opt-level = 3
